# Đặt tại /home/nginx/conf.d/khoa.net.conf (init-ssl.sh tự copy vào).

# HTTP — redirect sang HTTPS, ngoại trừ ACME challenge
server {
    listen 80;
    server_name khoa.net www.khoa.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://khoa.net$request_uri;
    }
}

# HTTPS — www.khoa.net → khoa.net
server {
    listen 443 ssl;
    http2 on;
    server_name www.khoa.net;

    ssl_certificate     /etc/letsencrypt/live/khoa.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khoa.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://khoa.net$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name khoa.net;

    ssl_certificate     /etc/letsencrypt/live/khoa.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khoa.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Phân giải tên container lúc có request (DNS nội bộ của Docker), không phải lúc nginx khởi động.
    # Nhờ vậy nếu khoanet-web đang tắt, nginx vẫn chạy bình thường cho hoamera.com và mocan.shop.
    resolver 127.0.0.11 valid=30s;
    set $khoanet_web http://khoanet-web:3000;

    # File build có hash trong tên, không bao giờ đổi — cache 1 năm
    location /_next/static/ {
        proxy_pass $khoanet_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js
    location / {
        proxy_pass         $khoanet_web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
